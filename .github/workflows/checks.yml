name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_smoke.py --engine ${{ matrix.engine }}
  windows-launcher:
    runs-on: windows-latest
    needs: container
    steps:
      - uses: actions/checkout@v4
      - run: ./build-windows.ps1
      - uses: actions/download-artifact@v4
        with:
          name: ResearchAgent-container-image
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchAgent-windows
          include-hidden-files: true
          path: |
            ResearchAgent.exe
            research-agent-image.tar.gz
            Dockerfile
            .dockerignore
            compose.yaml
            requirements.txt
            *.py
            static/
            README.md
            LICENSE
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 60
      - run: |
          curl -fsS http://127.0.0.1:8765/api/health | jq -e '.worker_alive and .pdf_configured and .instance == "research-agent-compose"'
          test -f data/research.sqlite3
          test -d Materials
          job=$(curl -fsS http://127.0.0.1:8765/api/jobs -H 'Content-Type: application/json' -d '{"source":"2409.10975","mode":"demo","settings":{"stage_seconds":10}}' | jq -er '.id')
          docker compose stop
          test -f data/research.sqlite3
          docker compose up -d --wait --wait-timeout 60
          curl -fsS "http://127.0.0.1:8765/api/jobs/$job" | jq -e '.status == "interrupted"'
      - run: docker image save research-agent:local | gzip > research-agent-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchAgent-container-image
          path: research-agent-image.tar.gz
      - if: always()
        run: docker compose down
